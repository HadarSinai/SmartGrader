<p-dialog
  header="תוצאת המחיקה"
  [visible]="visible"
  (visibleChange)="onVisibleChange($event)"
  [modal]="true"
  [style]="{ width: '34rem' }"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="true"
>
  <div class="flex flex-column gap-3" aria-live="polite">
    <div *ngIf="deletedCount > 0">
      <i class="pi pi-check-circle sg-icon-accent" aria-hidden="true"></i>
      נמחקו {{ rowsLabel(deletedCount) }}.
    </div>

    <div *ngIf="deletedCount === 0 && failures.length > 0">
      <i class="pi pi-info-circle" aria-hidden="true"></i>
      לא נמחקה אף שורה.
    </div>

    <!-- ⚠️ הסיבות הן העיקר ולא נספח: בלעדיהן המורה רואה שהשורות עדיין שם ואינה
         יודעת אם זו תקלה או כלל. הן מגיעות מהשרת כלשונן ומונות מה בדיוק חוסם. -->
    <div *ngIf="failures.length > 0">
      <div class="font-semibold mb-2">
        לא נמחקו ({{ failures.length }}):
      </div>
      <p-table [value]="failures" styleClass="sg-table">
        <ng-template pTemplate="header">
          <tr>
            <th style="width: 12rem">שורה</th>
            <th>הסיבה</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-row>
          <tr>
            <td class="font-bold text-color">{{ row.name }}</td>
            <td>{{ row.message }}</td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <p-button
      label="סגירה"
      styleClass="sg-btn-primary"
      (onClick)="close()"
    ></p-button>
  </ng-template>
</p-dialog>
