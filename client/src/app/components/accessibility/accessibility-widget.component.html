<button
  pButton
  icon="pi pi-universal-access"
  class="a11y-fab"
  type="button"
  (click)="visible = true"
  aria-label="פתיחת תפריט הנגישות">
</button>

<p-sidebar [(visible)]="visible" position="right" styleClass="a11y-sidebar">
  <div class="flex flex-column gap-3">
    <div class="flex align-items-center justify-content-between">
      <h3 class="m-0">נגישות</h3>
      <p-button label="איפוס" icon="pi pi-refresh" [text]="true" (onClick)="a11y.reset()"></p-button>
    </div>

    <div class="flex align-items-center justify-content-between">
      <div>
        <div class="font-semibold">מצב כהה</div>
        <small class="text-500">נוחות בעבודה בלילה</small>
      </div>
      <p-inputSwitch ariaLabel="מצב כהה" [ngModel]="a11y.state.dark" (onChange)="a11y.update({ dark: $event.checked })"></p-inputSwitch>
    </div>

    <div class="flex align-items-center justify-content-between">
      <div>
        <div class="font-semibold">טקסט גדול</div>
        <small class="text-500">הגדלת גופן בכל המערכת</small>
      </div>
      <p-inputSwitch ariaLabel="טקסט גדול" [ngModel]="a11y.largeText" (onChange)="setLargeText($event.checked)"></p-inputSwitch>
    </div>

    <div class="flex align-items-center justify-content-between">
      <div>
        <div class="font-semibold">הפחתת אנימציות</div>
        <small class="text-500">מינימום תנועה ואפקטים</small>
      </div>
      <p-inputSwitch ariaLabel="הפחתת אנימציות" [ngModel]="a11y.state.reduceMotion" (onChange)="a11y.update({ reduceMotion: $event.checked })"></p-inputSwitch>
    </div>

    <div class="border-top-1 pt-3" style="border-color: var(--app-border);">
      <!-- ⚠️ span ולא label: p-slider אינו שדה טופס שאפשר להצביע עליו ב-for. -->
      <span class="font-semibold block mb-2" id="a11y-scale-label">גודל טקסט מדויק</span>
      <p-slider
        ariaLabelledBy="a11y-scale-label"
        [min]="1"
        [max]="1.4"
        [step]="0.05"
        [ngModel]="a11y.state.scale"
        (onChange)="a11y.update({ scale: $event.value })">
      </p-slider>
    </div>

    <div class="flex align-items-center justify-content-between">
      <span class="font-semibold">ניגודיות גבוהה</span>
      <p-inputSwitch ariaLabel="ניגודיות גבוהה" [ngModel]="a11y.state.highContrast" (onChange)="a11y.update({ highContrast: $event.checked })"></p-inputSwitch>
    </div>

    <div class="flex align-items-center justify-content-between">
      <span class="font-semibold">הדגשת קישורים</span>
      <p-inputSwitch ariaLabel="הדגשת קישורים" [ngModel]="a11y.state.highlightLinks" (onChange)="a11y.update({ highlightLinks: $event.checked })"></p-inputSwitch>
    </div>
  </div>
</p-sidebar>
