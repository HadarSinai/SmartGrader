name: tests

# מריץ את בדיקות היחידה של השרת בכל דחיפה ובכל PR.
#
# למה זה קיים: Smart App Control של ווינדוס חוסם במחשב הפיתוח את טעינת Domain.dll
# שנבנה מקומית (0x800711C7), ולכן אי אפשר לסמוך על הרצה מקומית. הריצה כאן היא על
# לינוקס, שם המדיניות הזו לא קיימת — וממילא זה מה שהופך את הבדיקות ממשמעת אישית
# למנגנון שעובד גם ביום לחוץ.
#
# ⚠️ אדום כאן = לא ממזגים. זו כל הנקודה.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore server/Tests/SmartGrader.UnitTests/SmartGrader.UnitTests.csproj

      - name: Test
        run: |
          set -o pipefail
          dotnet test server/Tests/SmartGrader.UnitTests/SmartGrader.UnitTests.csproj \
            --no-restore \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=results.trx" \
            --results-directory "$GITHUB_WORKSPACE/test-results" 2>&1 | tee test-output.txt

      # ריצה ירוקה שאומרת רק "success" לא מספרת כמה בדיקות באמת רצו — ואם קובץ בדיקות
      # מפסיק להיטען, הירוק נראה זהה. השורה הזו מפרסמת את הספירה במקום שנקרא בלי טוקן.
      # רץ גם על ריצה אדומה: "כמה נכשלו מתוך כמה" הוא בדיוק מה שצריך לדעת כשאדום,
      # ו-if: success() הסתיר את הספירה בדיוק שם.
      - name: Publish the pass count
        if: always()
        run: |
          # נקרא מקובץ ה-trx ולא מטקסט הקונסולה: ניסוח שורת הסיכום משתנה בין גרסאות SDK
          # ובין loggers, וההתאמה למחרוזת נכשלה פעמיים. ל-trx יש מבנה קבוע.
          trx=$(find "$GITHUB_WORKSPACE/test-results" -name '*.trx' | head -1)

          if [ -n "$trx" ]; then
            counters=$(grep -o '<Counters [^>]*>' "$trx" | head -1)
            total=$(echo "$counters" | grep -o 'total="[0-9]*"' | grep -o '[0-9]*')
            passed=$(echo "$counters" | grep -o 'passed="[0-9]*"' | grep -o '[0-9]*')
            failed=$(echo "$counters" | grep -o 'failed="[0-9]*"' | grep -o '[0-9]*')
            line="Passed: ${passed}/${total} · Failed: ${failed}"
            echo "::notice::${line}"
            echo "## $line" >> "$GITHUB_STEP_SUMMARY"
          else
            # ⚠️ ריצה בלי ספירה היא בדיוק המצב שהשלב הזה קיים כדי לשלול
            echo "::warning::לא נמצא קובץ trx — לא ידוע כמה בדיקות רצו"
            echo "::notice::tail: $(tail -3 test-output.txt | tr '\n' ' ')"
          fi

      # ⚠️ הלוג הגולמי של Actions דורש הזדהות גם בריפו ציבורי, אבל *אנוטציות* ותקציר
      # העבודה נגישים בלי טוקן. בלי השלב הזה הכשל מגיע החוצה כ-"exit code 1" בלבד,
      # ואי אפשר לתקן אותו בלי לפתוח את הדפדפן ולהעתיק ידנית.
      #
      # ⚠️⚠️ GitHub מציג **10 אנוטציות מכל סוג בכל שלב** ומשליך את השאר בלי שום סימן.
      # שורה-נפרדת-לכל-כשל נראתה תקינה עד שריצה עם 15 כשלים הראתה 10 — כלומר בדיוק
      # אותה תבנית של "ירוק/אדום שנראה שלם ואינו". לכן כל הכשלים יוצאים באנוטציה
      # **אחת** מרובת-שורות (‎%0A‎), שהתקרה לא נוגעת בה.
      - name: Publish failures where they can be read without a token
        if: failure()
        run: |
          clean=$(sed 's/\x1b\[[0-9;]*m//g' test-output.txt)

          fails=$(printf '%s\n' "$clean" | grep -aE "error CS|^[[:space:]]*Failed " || true)

          # כשל בנייה או קריסה לפני שהבדיקות רצו — אין שורות "Failed", אז מוציאים את הזנב
          [ -z "$fails" ] && fails=$(printf '%s\n' "$clean" | tail -20)

          count=$(printf '%s\n' "$fails" | grep -c . || true)

          # ‎%‎ חייב להיות מוחלף ראשון, אחרת הוא בורח גם את ה-%0A שאנחנו מוסיפים בעצמנו
          encoded=$(printf '%s' "$fails" | sed -e 's/%/%25/g' -e 's/\r//g' | sed -z 's/\n/%0A/g')
          echo "::error::${count} כשלים:%0A${encoded}"

          {
            echo "## כשלי בדיקות ($count)"
            echo '```'
            printf '%s\n' "$clean" \
              | grep -aE "error CS|^[[:space:]]*(Failed|Error Message|Expected|Actual|Assert)" | head -200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
