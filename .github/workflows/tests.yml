name: tests

# מריץ את בדיקות היחידה של השרת בכל דחיפה ובכל PR.
#
# למה זה קיים: Smart App Control של ווינדוס חוסם במחשב הפיתוח את טעינת Domain.dll
# שנבנה מקומית (0x800711C7), ולכן אי אפשר לסמוך על הרצה מקומית. הריצה כאן היא על
# לינוקס, שם המדיניות הזו לא קיימת — וממילא זה מה שהופך את הבדיקות ממשמעת אישית
# למנגנון שעובד גם ביום לחוץ.
#
# ⚠️ אדום כאן = לא ממזגים. זו כל הנקודה.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore server/Tests/SmartGrader.UnitTests/SmartGrader.UnitTests.csproj

      - name: Test
        run: |
          set -o pipefail
          dotnet test server/Tests/SmartGrader.UnitTests/SmartGrader.UnitTests.csproj \
            --no-restore \
            --logger "console;verbosity=normal" 2>&1 | tee test-output.txt

      # ריצה ירוקה שאומרת רק "success" לא מספרת כמה בדיקות באמת רצו — ואם קובץ בדיקות
      # מפסיק להיטען, הירוק נראה זהה. השורה הזו מפרסמת את הספירה במקום שנקרא בלי טוקן.
      - name: Publish the pass count
        if: success()
        run: |
          summary=$(grep -E "^(Passed!|Failed!)" test-output.txt | head -1 || true)
          if [ -n "$summary" ]; then
            echo "::notice::${summary}"
            echo "## $summary" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ⚠️ הלוג הגולמי של Actions דורש הזדהות גם בריפו ציבורי, אבל *אנוטציות* ותקציר
      # העבודה נגישים בלי טוקן. בלי השלב הזה הכשל מגיע החוצה כ-"exit code 1" בלבד,
      # ואי אפשר לתקן אותו בלי לפתוח את הדפדפן ולהעתיק ידנית.
      - name: Publish failures where they can be read without a token
        if: failure()
        run: |
          {
            echo "## כשלי בדיקות"
            echo '```'
            grep -E "error CS|^[[:space:]]*(Failed|Error Message|Expected|Actual|Assert)" test-output.txt \
              | head -120 || tail -40 test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          emitted=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "::error::${line}"
            emitted=$((emitted + 1))
          done < <(grep -E "error CS|^[[:space:]]*Failed " test-output.txt | head -25)

          # כשל בנייה או קריסה לפני שהבדיקות רצו — אין שורות "Failed", אז מוציאים את הזנב
          if [ "$emitted" -eq 0 ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              echo "::error::${line}"
            done < <(tail -20 test-output.txt)
          fi

          summary=$(grep -E "^(Passed!|Failed!)" test-output.txt | head -1 || true)
          [ -n "$summary" ] && echo "::error::${summary}" || true
